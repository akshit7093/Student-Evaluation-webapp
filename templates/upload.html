<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Files - Student Assessment System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/upload.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <nav class="breadcrumb">
            <a href="{{ url_for('dashboard') }}">Dashboard</a> > Upload Files
        </nav>

        <div class="upload-section">
            <h1>Upload Files</h1>
            <div class="selection-controls">
                <select id="branchSelect" required>
                    {% for branch in branches %}
                    <option value="{{ branch }}">{{ branch }}</option>
                    {% endfor %}
                </select>
                <select id="yearSelect" required>
                    <option value="1">First Year</option>
                    <option value="2">Second Year</option>
                    <option value="3">Third Year</option>
                    <option value="4">Fourth Year</option>
                </select>
                <select id="studentSelect" required>
                    <option value="">Select Student</option>
                </select>
            </div>
            
            <div class="upload-grid">
                <div class="upload-card">
                    <h2><i class="fas fa-tasks"></i> Assignments</h2>
                    <div class="file-upload-zone" data-section="assignments">
                        <input type="file" multiple class="file-input" accept=".pdf,.doc,.docx,.zip">
                        <div class="drop-zone">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Drag files here or click to upload</p>
                        </div>
                        <div class="file-list"></div>
                    </div>
                </div>
                
                <div class="upload-card">
                    <h2><i class="fas fa-project-diagram"></i> Projects</h2>
                    <div class="file-upload-zone" data-section="projects">
                        <input type="file" multiple class="file-input" accept=".pdf,.doc,.docx,.zip">
                        <div class="drop-zone">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Drag files here or click to upload</p>
                        </div>
                        <div class="file-list"></div>
                    </div>
                </div>

                <div class="upload-card">
                    <h2><i class="fas fa-file-alt"></i> Reports</h2>
                    <div class="file-upload-zone" data-section="reports">
                        <input type="file" multiple class="file-input" accept=".pdf,.doc,.docx">
                        <div class="drop-zone">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Drag files here or click to upload</p>
                        </div>
                        <div class="file-list"></div>
                    </div>
                </div>
            </div>

            <div class="upload-status">
                <h3>Upload Status</h3>
                <div class="status-messages"></div>
            </div>

            <div class="existing-files">
                <h3>Existing Files</h3>
                <div class="files-container">
                    <div class="file-section" id="existing-assignments">
                        <h4>Assignments</h4>
                        <ul class="file-list"></ul>
                    </div>
                    <div class="file-section" id="existing-projects">
                        <h4>Projects</h4>
                        <ul class="file-list"></ul>
                    </div>
                    <div class="file-section" id="existing-reports">
                        <h4>Reports</h4>
                        <ul class="file-list"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/upload.js') }}"></script>
</body>
</html>
